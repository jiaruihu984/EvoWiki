# 第 3 类 不损坏内容: after the change, is what he did not ask to change still there, and is what he
# asked done as he said? Graded by paragraph diff on the page's own state before and after.
# Every page in world r1 is the audit's page text: 度与度分布 s1 has 2 paragraphs, s2 has 4, s3 has 6
# formulas.

- id: cut-first-para
  kind: act
  topic: 渗流
  world: r1
  source: {ref: "决定清单 3", db: audit_cards2, failed: "已生成草稿：第一节只保留了前两句，删掉了后面「回上一页 5 人网络的边集」那段引入。（实际第二段也一起删了）"}
  steps: [{say: "把第一节第一段改短，只留前两句", page: 度与度分布}, {accept: true}]
  grade:
    - nothing_before_confirm: {}
    - others_untouched: {page: 度与度分布, section: 0}
    - paragraph_kept: {page: 度与度分布, section: 0}
    - section_changed: {page: 度与度分布, section: 0}
