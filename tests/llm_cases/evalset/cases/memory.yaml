- id: forget-fact-same-conversation
  kind: canary
  topic: 按事实忘记
  world: r1
  source:
    ref: 按事实忘记的缺口：同一个对话里确认忘掉之后，上文原话不能再回答出来；问的话要接着正常答
  purposes:
  - assistant.turn
  steps:
  - say: 我家猫叫年糕，今年三岁，最近总掉毛。
    page: 度与度分布
