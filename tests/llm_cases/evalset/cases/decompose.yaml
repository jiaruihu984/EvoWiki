# 第 8 类 拆解路径: the product splits a new goal into blocks now, as the user would ask it. Gold coverage (where
# Metacademy has the goal) reads the blocks' names, included points, summaries and definitions; off-topic, count and
# repeats read the names.
# `floors_unverified_by_user`: the three floors are the machine-learning ones (gold/README.md Threshold);
# the other two goals use the same numbers.
- id: goal-ml
  kind: act
  topic: 机器学习
  world: r1
  source: {ref: "tests/llm_cases/gold：Metacademy 机器学习（锚点 13 个，README 的三条下限）"}
  steps: [{say: "我想学机器学习"}, {accept: true}, {settle: true}]
  grade:
    - turn_ok: {}
    - gold_coverage: {goal: 机器学习}
- id: goal-nn
  kind: act
  topic: 神经网络
  world: r1
  source: {ref: "tests/llm_cases/gold：Metacademy 神经网络", floors_unverified_by_user: true}
  steps: [{say: "我想学神经网络"}, {accept: true}, {settle: true}]
  grade:
    - turn_ok: {}
    - gold_coverage: {goal: 神经网络}
- id: goal-svd
