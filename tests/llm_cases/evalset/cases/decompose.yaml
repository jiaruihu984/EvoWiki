- id: goal-python-twice
  kind: no_act
  topic: python
  world: r1
  source: {ref: "goals.md 需要你定 3：重复目标不拦，再输 python 又花 64 秒分出一份新稿，没提旧目标", failed: "又分出一份 8 块的新稿"}
  steps: [{say: "我想学 python"}, {accept: true}, {settle: true}, {say: "我想学 python"}]
  grade:
    - turn_tool_not_called: {turn: 2, names: [new_goal]}
