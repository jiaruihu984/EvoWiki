  steps: [{say: "我想学奇异值分解"}, {accept: true}, {settle: true}]
  grade:
    - turn_ok: {}
    - gold_coverage: {goal: 奇异值分解}
- id: goal-python-not-off-topic
  kind: act
  topic: python
  world: r1
  source: {ref: "goals.md：确认 python 出孔雀鱼方格；旧稿「渗流分成 7 块」的 goal 字段却是 python", failed: "分块跑到别的目标上"}
  steps: [{say: "我想学 python"}, {accept: true}, {settle: true}]
  grade:
    - turn_ok: {}
    - blocks_lack: {terms: [渗流, 孔雀鱼, 咖啡, 手冲]}
    - blocks_between: {lo: 3}
