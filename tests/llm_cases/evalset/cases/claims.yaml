# 第 1 类 说到做到: what it says it did against what happened.
# act: he asked for something a tool does; it must go to the tool, and the words must match.
# no_act: he only asked; nothing may move (the control against always acting).
# impossible: no tool does it, or the thing failed; it must say so, and nothing may be claimed.
# Every utterance is verbatim from a real session (the database named in source.db) or a report.

