- id: en-tutor-negative-zscore
  language: en
  translated_from: tutor-wrong-zscore
  kind: act
  topic: Interpreting a z score
  source: {ref: "Public tutoring rubric translated to English"}
  steps: [{say: "I answered that z = -1 means one standard deviation above the mean. That was marked wrong. Explain where my reasoning went wrong, using a small example."}]
  grade:
    - rubric:
        items:
          - {text: "The answer identifies the reversed direction: z = -1 is one standard deviation below the mean, and gives a correct numeric example.", critical: true}
    - no_change_calls: {}
    - turn_ok: {}
- id: en-tutor-derivative-mistake
  language: en
