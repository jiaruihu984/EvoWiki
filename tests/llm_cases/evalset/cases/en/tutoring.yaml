  kind: control
  topic: Differentiation
  source: {ref: "Public exponent-error tutoring rubric translated to English"}
  steps: [{say: "For the derivative of x cubed I chose 3x cubed instead of 3x squared. Explain my mistake without marking me as having mastered derivatives."}]
