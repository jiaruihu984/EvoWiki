name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan tracked files, working files and all reachable history
        run: python scripts/check_secrets.py --download
      - name: Save metadata-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-check-metadata
          path: |
            .evowiki-run/security/summary.json
            .evowiki-run/security/*.jsonl
          if-no-files-found: ignore
