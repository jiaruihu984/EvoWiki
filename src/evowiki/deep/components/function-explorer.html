  if(cmpP&&showCmp)leg( ewt("对比：")+EvoWikiLocale.string(cmpCfg.label||'').slice(0,12),'curve2');
  leg( ewt("当前曲线"),'curve');
  const seen={};mk.pts.forEach(q=>{svg.append(shape(q.shape,X(q.x),Y(q.y)));if(!seen[q.name]){seen[q.name]=1;svg.append(el('text',{x:Math.min(R-30,X(q.x)+9),y:Math.max(T+10,Y(q.y)-9),class:'mkTx'},q.name))}});
  const xv=xlo+(xhi-xlo)*xs,yv=f(P,xv);
  if(Number.isFinite(yv)&&yv>=ylo&&yv<=yhi){svg.append(el('line',{x1:X(xv),y1:Y(yv),x2:X(xv),y2:B,class:'xcur'}));svg.append(el('circle',{cx:X(xv),cy:Y(yv),r:5,class:'xdot'}))}
  EvoWikiLocale.prop($('plotDesc'),"textContent",()=>formula(P));
  EvoWikiLocale.prop($('xsTx'),"innerHTML",()=>`x = <b>${num3(xv)}</b>${esc(xu)}`);
  const row=(k,v)=>`<div><span class="k">${k}</span>${v}</div>`;
  let rd=row( ewt("当前公式"),`<b>${esc(formula(P))}</b>`);
  rd+=row( ewt("读取点：x = {0}{1}", [num3(xv),esc(xu)]),Number.isFinite(yv)?`y = <b>${num3(yv)}</b>${esc(yu?' '+yu:'')}`: ewt("这里没有定义"));
  const names={};mk.pts.forEach(q=>{(names[q.name]=names[q.name]||[]).push(`(${num3(q.x)}, ${num3(q.y)})`)});
  Object.keys(names).forEach(n=>rd+=row(n,names[n].join('，')));
  if(mk.h.length+mk.v.length)rd+=row( ewt("渐近线 / 参考线"),mk.h.concat(mk.v).map(a=>esc(a.name)).join('，'));
  if(cmpP&&showCmp)rd+=row( ewt("对比曲线"),esc(formula(cmpP)));
  EvoWikiLocale.prop($('read'),"innerHTML",()=>rd);
  if(announce)say(mk,xv,yv)}
function say(mk,xv,yv){let m=last;
  const q=mk.pts[0];
  if(q)m+= ewt(" {0}在 ({1}, {2})。", [q.name,num3(q.x),num3(q.y)]);
  else if(mk.pts.length===0&&(has('vertex')||has('zeros'))&&['quadratic','sine','linear','normal'].includes(fam))m+= ewt(" 在当前范围里这类关键点不存在或不在图内。");
  if(Number.isFinite(yv))m+= ewt(" x = {0} 时 y = {1}。", [num3(xv),num3(yv)]);
  EvoWikiLocale.prop($('result'),"textContent",()=>m.trim())}
// controls
specs.filter(s=>s.adj).forEach((s,i)=>{const d=document.createElement('div');d.className='ctl';
  EvoWikiLocale.prop(d,"innerHTML",()=> ewt("<label for=\"p{0}\">{1}（{2}）：<b id=\"p{3}v\"></b></label><div class=\"pc\"><button type=\"button\" id=\"p{4}-dec\" aria-label=\"减小{5}\">−</button><input id=\"p{6}\" type=\"range\" min=\"{7}\" max=\"{8}\" step=\"{9}\" value=\"{10}\"><button type=\"button\" id=\"p{11}-inc\" aria-label=\"增大{12}\">+</button></div>", [i,esc(s.label),esc(SYM[s.key]),i,i,esc(s.label),i,s.min,s.max,s.step,s.v0,i,esc(s.label)]));
  $('pcs').append(d);s.i=i;
  const set=(v,how)=>{v=Math.min(s.max,Math.max(s.min,Number(v.toFixed(dec(s)))));const old=P[s.key];P[s.key]=v;$(`p${i}`).value=v;
    last= ewt("{0}从 {1} {2}到 {3}{4}。{5}", [s.label,num3(old),v>old? ewt("调大"):v<old? ewt("调小"): ewt("保持"),num3(v),s.unit?s.unit:'',s.effect?' '+s.effect:'']);sync();draw(true)};
  $(`p${i}`).addEventListener('input',e=>set(Number(e.target.value)));
  $(`p${i}-inc`).onclick=()=>{let v=P[s.key]+s.step;if(v>s.max+1e-9)v=P[s.key]-s.step;set(v)};
  $(`p${i}-dec`).onclick=()=>{let v=P[s.key]-s.step;if(v<s.min-1e-9)v=P[s.key]+s.step;set(v)}});
function sync(){specs.filter(s=>s.adj).forEach(s=>{EvoWikiLocale.prop($(`p${s.i}v`),"textContent",()=>num3(P[s.key])+(s.unit?' '+s.unit:''))})}
if(cmpP){$('cmpRow').hidden=false;EvoWikiLocale.prop($('cmpTx'),"textContent",()=> ewt("叠加对比曲线：")+EvoWikiLocale.string(cmpCfg.label||''));
  $('compare').addEventListener('change',e=>{showCmp=e.target.checked;last=showCmp? ewt("叠加了对比曲线“{0}”，虚线是它。", [cmpCfg.label]): ewt("去掉了对比曲线。");draw(true)})}
$('xs').addEventListener('input',e=>{xs=Number(e.target.value)/1000;last= ewt("读取点移动了。");draw(true)});
$('reset').onclick=()=>{specs.forEach(s=>{P[s.key]=s.v0;if(s.adj)$(`p${s.i}`).value=s.v0});sync();last= ewt("参数还原成初始值。");draw(true)};
EvoWikiLocale.prop($('title'),"textContent",()=>C.title||'');EvoWikiLocale.prop($('question'),"textContent",()=>C.question||'');
sync();last= ewt("初始状态。");
new ResizeObserver(()=>draw(false)).observe($('stage'));
draw(true);

EvoWikiLocale.onChange(()=>{draw()});</script>
</body>
</html>
