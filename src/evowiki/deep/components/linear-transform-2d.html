<script>const ewt=window.EvoWikiLocale.t;

const num=(v,d)=>v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v):d;

const VIEW=Math.min(8,Math.max(1.5,num(C.view,3)));

const mats=(C.matrices||[]).slice(0,4).map((m,i)=>({name:EvoWikiLocale.string(m.name||( ewt("矩阵 ")+(i+1))).slice(0,20),a:cl(num(m.a,1),4),b:cl(num(m.b,0),4),c:cl(num(m.c,0),4),d:cl(num(m.d,1),4),meaning:m.meaning?EvoWikiLocale.string(m.meaning).slice(0,240):''}));

const v0=C.vector||{};let vx0=num(v0.x,1),vy0=num(v0.y,0);if(Math.hypot(vx0,vy0)<0.2){vx0=1;vy0=0}
const vlen=Math.min(VIEW*0.9,Math.hypot(vx0,vy0));

let mi=0,t=1,ang=Math.round(ang0),last='';
const showSq=C.show_square!==false,showEig=C.show_eigen!==false;
const fm=(v,d=2)=>{const r=Number(v.toFixed(d));return Object.is(r,-0)?'0':EvoWikiLocale.string(r)};
function eigen(m){const {a,b,c,d}=m,tr=a+d,det=a*d-b*c,disc=tr*tr/4-det;
  if(Math.abs(b)<1e-9&&Math.abs(c)<1e-9&&Math.abs(a-d)<1e-9)return {all:true,lam:a,list:[]};
  if(disc<-1e-9)return {complex:true,list:[],det,tr};

const parallel=(p,q)=>{const cr=Math.abs(p[0]*q[1]-p[1]*q[0])/(Math.hypot(...p)*Math.hypot(...q)||1);return cr<Math.sin(2*Math.PI/180)};

  svg.append(el('line',{x1:x0,y1:y0,x2:x1-ux*h*.6,y2:y1-uy*h*.6,class:cls}));

function draw(announce){
  const W=Math.max(280,Math.min(520,Math.round($('stage').clientWidth-16))),S=W;
  const c=S/2,k=(S/2-18)/VIEW;
  const X=v=>c+v*k,Y=v=>c-v*k;
  const svg=$('plot');EvoWikiLocale.attr(svg,'viewBox',()=>`0 0 ${S} ${S}`);svg.style.maxWidth=S+'px';svg.style.margin='0 auto';
  svg.querySelectorAll(':scope > :not(desc)').forEach(n=>n.remove());
  const cid='clip'+(draw.n=(draw.n||0)+1);
  const defs=el('defs',{});const cp=el('clipPath',{id:cid});cp.append(el('rect',{x:0,y:0,width:S,height:S}));defs.append(cp);svg.append(defs);
  const g=el('g',{'clip-path':`url(#${cid})`});svg.append(g);
  const m=Mt(),A=cur(),N=Math.ceil(VIEW*3)+2,R=VIEW*6;

    g.append(el('line',{x1:X(i),y1:0,x2:X(i),y2:S,class:'g0'}));g.append(el('line',{x1:0,y1:Y(i),x2:S,y2:Y(i),class:'g0'}))}
  for(let i=-N;i<=N;i++){

    p=tr(-R,i);q=tr(R,i);g.append(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'g1'}))}
  g.append(el('line',{x1:0,y1:Y(0),x2:S,y2:Y(0),class:'axis'}));g.append(el('line',{x1:X(0),y1:0,x2:X(0),y2:S,class:'axis'}));
  const e=eigen(A);
  if(showEig)e.list.forEach(q=>{const L=VIEW*4;g.append(el('line',{x1:X(-q.x*L),y1:Y(-q.y*L),x2:X(q.x*L),y2:Y(q.y*L),class:'eig'}))});
  if(showSq){g.append(el('rect',{x:X(0),y:Y(1),width:k,height:k,class:'sq0'}));
    const pp=[[0,0],[1,0],[1,1],[0,1]].map(p=>tr(p[0],p[1]));g.append(el('path',{d:'M'+pp.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z',class:'sq1'}))}
  const [iu,iw]=app(m,1,0),[ju,jw]=app(m,0,1);
  const v=vec(),[wu,ww]=app(m,v[0],v[1]);
  arrow(g,X(0),Y(0),X(v[0]),Y(v[1]),'vv','vv-h');
  arrow(g,X(0),Y(0),X(iu),Y(iw),'vi','vi-h');arrow(g,X(0),Y(0),X(ju),Y(jw),'vj','vj-h');
  arrow(g,X(0),Y(0),X(wu),Y(ww),'vw','vw-h');
  // labels (outside the clip group)
  const lab=(x,y,txt,col,dx=8,dy=-6)=>{const px=Math.max(6,Math.min(S-6,X(x)+dx)),py=Math.max(14,Math.min(S-6,Y(y)+dy));
    const t1=el('text',{x:px,y:py,class:'lbTx','text-anchor':px>S-60?'end':'start'},txt);EvoWikiLocale.attr(t1,'style',()=>'fill:'+col);EvoWikiLocale.attr(t1,'paint-order',()=>'stroke');EvoWikiLocale.attr(t1,'stroke',()=>'var(--bg-1)');EvoWikiLocale.attr(t1,'stroke-width',()=>'3');svg.append(t1)};
  lab(iu,iw,t>=.99?'Ai': ewt("变换后的 i"),'var(--accent)');lab(ju,jw,t>=.99?'Aj': ewt("变换后的 j"),'var(--good)',8,-6);

  svg.append(el('text',{x:S-6,y:Y(0)-7,'text-anchor':'end',class:'axTx'},ax));svg.append(el('text',{x:X(0)+7,y:14,class:'axTx'},ay));
  EvoWikiLocale.prop($('plotDesc'),"textContent",()=> ewt("矩阵 {0}，t = {1}，行列式 {2}", [cur().name,fm(t),fm(A.a*A.d-A.b*A.c)]));

  rd+=row( ewt("向量"),`v = (${fm(v[0])}, ${fm(v[1])})　→　Av = (<b>${fm(Au)}</b>, <b>${fm(Aw)}</b>)`);
  rd+=row( ewt("行列式 = 面积倍数"), ewt("<b>{0}</b>{1}", [fm(det),t<.99? ewt("（现在 t = {0}：{1}）", [fm(t),fm(dt)]):'']));

  const sn=$('snaps');const key=e.list.map(q=>q.x.toFixed(3)+q.y.toFixed(3)).join('|')+mi;
  if(sn.dataset.key!==key){sn.dataset.key=key;EvoWikiLocale.prop(sn,"innerHTML",()=>'');
    e.list.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.id='snap-'+i;EvoWikiLocale.prop(b,"textContent",()=> ewt("把 v 转到特征方向（λ = ")+fm(q.lam)+'）');

  const onEig=!e.complex&&(e.all||e.list.find(q=>parallel(v,[q.x,q.y])));
  if(e.all)verdict= ewt("A 对每个方向一视同仁：任何 v 都只是被放大，不会转动。");
  else if(e.complex)verdict= ewt("v 被转了 {0}°，这个矩阵找不到只伸缩不转动的方向。", [fm(Math.abs(angDiff(v,w)),0)]);
  else if(onEig){const q=e.list.find(q=>parallel(v,[q.x,q.y]));verdict= ewt("v 正好落在特征方向上：Av 和 v 在同一条直线上，只是长度变成 {0} 倍（特征值 λ = {1}）。", [fm(lv>0?lw/lv:0),fm(q.lam)])}
  else verdict= ewt("v 不在特征方向上：Av 比 v 转了 {0}°，长度变成 {1} 倍。", [fm(Math.abs(angDiff(v,w)),0),fm(lv>0?lw/lv:0)]);
  const mean=(m.includes( ewt("矩阵"))&&A_.meaning)?(' '+A_.meaning):'';
  EvoWikiLocale.prop($('result'),"textContent",()=>(m+mean+' '+area+' '+verdict+(t<.99? ewt(" （现在只变了 t = {0} 的程度，Av 是 t = 1 时的结果。）", [fm(t)]):'')).trim())}
// controls
const mr=$('mats');
if(mats.length>1){mr.hidden=false;mats.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.id='mat-'+i;EvoWikiLocale.prop(b,"textContent",()=>q.name);EvoWikiLocale.attr(b,'aria-pressed',()=>i===0);mr.append(b);
  b.onclick=()=>{mi=i;mats.forEach((_,j)=>EvoWikiLocale.attr($('mat-'+j),'aria-pressed',()=>j===i));last= ewt("换成“{0}”矩阵。", [q.name]);draw(true)}})}
$('t').addEventListener('input',e=>{t=Number(e.target.value)/100;last= ewt("t 调到 {0}：网格从原样变了 {1}% 的程度。", [fm(t),fm(t*100,0)]);draw(true)});
$('ang').addEventListener('input',e=>{ang=Number(e.target.value);last= ewt("把 v 转到 {0}°。", [ang]);draw(true)});
const rot=d=>{ang=((ang+d)%360+360)%360;$('ang').value=ang;last= ewt("把 v {0}时针转了 15°，现在在 {1}°。", [d>0? ewt("逆"): ewt("顺"),ang]);draw(true)};
$('rot-ccw').onclick=()=>rot(15);$('rot-cw').onclick=()=>rot(-15);
$('reset').onclick=()=>{t=1;ang=Math.round(ang0);mi=0;$('t').value=100;$('ang').value=ang;if(mats.length>1)mats.forEach((_,j)=>EvoWikiLocale.attr($('mat-'+j),'aria-pressed',()=>j===0));last= ewt("全部还原。");draw(true)};
EvoWikiLocale.prop($('title'),"textContent",()=>C.title||'');EvoWikiLocale.prop($('question'),"textContent",()=>C.question||'');
$('ang').value=ang;last= ewt("矩阵“{0}”。", [cur().name]);
new ResizeObserver(()=>draw(false)).observe($('stage'));
draw(true);

EvoWikiLocale.onChange(()=>{draw()});</script>
