<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--ew-t:%22%E5%88%86%E7%B1%BB%E4%B8%8E%E9%85%8D%E5%AF%B9%22-->分类与配对</title>
<style>
/* ---- EvoWiki component base (shared by every library component; keep identical) ---- */
:root{
  --bg:var(--evowiki-bg,#ffffff);--bg-1:var(--evowiki-bg-1,#f6f6f7);--bg-2:var(--evowiki-bg-2,#ececef);
  --line:var(--evowiki-line,#d9d9de);--tx:var(--evowiki-tx,#1f1f24);--tx-2:var(--evowiki-tx-2,#55555e);
  --tx-3:var(--evowiki-tx-3,#76767f);--accent:var(--evowiki-accent,#6b4fd6);--accent-tx:#ffffff;
  --accent-soft:var(--evowiki-accent-soft,#eeeafc);--good:#22804d;--warn:#a66a00;--bad:#c23b2e;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--evowiki-bg,#1e1e21);--bg-1:var(--evowiki-bg-1,#26262a);--bg-2:var(--evowiki-bg-2,#313136);
  --line:var(--evowiki-line,#3d3d44);--tx:var(--evowiki-tx,#e6e6ea);--tx-2:var(--evowiki-tx-2,#b0b0b8);
  --tx-3:var(--evowiki-tx-3,#8c8c95);--accent:var(--evowiki-accent,#a48ff2);--accent-tx:#17141f;
  --accent-soft:var(--evowiki-accent-soft,#2f2945);--good:#5cc98a;--warn:#e0a43a;--bad:#f0786b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--font)}
::selection{background:var(--accent-soft);color:var(--tx)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
main{padding:14px 16px 18px;max-width:880px;margin:0 auto}
h1{font-size:17px;line-height:1.35;margin:0 0 4px;font-weight:650;text-wrap:balance}
.q{margin:0 0 14px;color:var(--tx-2)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,250px);gap:16px;align-items:start}
@media (max-width:620px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--bg-1);border-radius:10px;padding:8px;min-width:0}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label,.ctl .lb{font-size:13px;color:var(--tx-2)}
.ctl b{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:6px 12px;min-height:36px;cursor:pointer}
button:hover{background:var(--bg-2)}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-tx)}
button:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.read{font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--tx-2);font-variant-numeric:tabular-nums;
  overflow-wrap:break-word;display:flex;flex-direction:column;gap:6px}
.read .k{display:block;font-family:var(--font);font-size:12px;color:var(--tx-3)}
.read b{color:var(--tx)}
#result{background:var(--accent-soft);border-radius:8px;padding:10px 12px;line-height:1.6;margin:0}
.muted{color:var(--tx-3);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- component ---- */
h2{font-size:14px;line-height:1.4;margin:0;font-weight:650}
.lb{font-size:13px;color:var(--tx-2);margin:0 0 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:6px;border:1px dashed transparent;border-radius:10px;margin-bottom:14px}
.pool.over{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;cursor:grab;touch-action:manipulation;text-align:left}
.chip.ok{border:2px solid var(--good)}
.chip.bad{border:2px dashed var(--bad)}
.chip.miss{border-style:dashed}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.tg{background:var(--bg-1);border:1px dashed var(--line);border-radius:10px;padding:10px 12px 12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.tg.over{border-style:solid;border-color:var(--accent)}
.tg-h{display:flex;flex-direction:column;gap:2px}
.put{align-self:flex-start;font-size:13px;min-height:34px}
.it{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.it-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.st.ok{color:var(--good)}.st.bad{color:var(--bad)}.st.miss{color:var(--tx-2)}
.st svg{width:14px;height:14px}
.fb{margin:0;font-size:13.5px;line-height:1.55;color:var(--tx-2)}
.empty{font-size:13px;color:var(--tx-3);margin:0;align-self:center;padding-left:6px}
.bar{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.cnt{font-size:13px;color:var(--tx-2);font-variant-numeric:tabular-nums}
</style>
<script data-evowiki-locale="sort-match"></script>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="q" id="question"></p>
  <p class="lb" id="poolLb"></p>
  <div class="pool" id="pool" aria-label="待放的项目" data-ew-attrs='{"aria-label":"待放的项目"}'></div>
  <div class="targets" id="targets"></div>
  <div class="bar">
    <div class="row">
      <button type="button" id="check"><!--ew-t:%22%E6%A3%80%E6%9F%A5%E5%85%A8%E9%83%A8%22-->检查全部</button>
      <button type="button" id="show"><!--ew-t:%22%E6%98%BE%E7%A4%BA%E7%AD%94%E6%A1%88%22-->显示答案</button>
      <button type="button" id="reset"><!--ew-t:%22%E9%87%8D%E7%BD%AE%22-->重置</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <p id="result" aria-live="polite"></p>
  </div>
</main>
<script>const ewt=window.EvoWikiLocale.t;

const DEFAULT={"title": ewt("统计量：它描述“中心”还是“分散”？"),"question": ewt("把每个统计量放进它回答的问题：数据大概在哪里，还是数据有多散？"),"mode":"classify","targets":[{"id":"c","label": ewt("集中趋势"),"hint": ewt("数据大概落在哪里")},{"id":"d","label": ewt("离散程度"),"hint": ewt("数据有多分散")}],"items":[{"id":"1","label": ewt("平均数"),"answer":"c","explain": ewt("平均数把所有数合成一个“典型值”，描述中心位置，不描述散布。"),"wrong_reasons":[{"target":"d","why": ewt("平均数只给出一个中心位置；同一个平均数可以来自很集中、也可以来自很分散的数据。")}]},{"id":"2","label": ewt("方差"),"answer":"d","explain": ewt("方差是偏差平方的平均，数据越分散它越大，回答的是“有多散”。"),"wrong_reasons":[{"target":"c","why": ewt("方差不告诉你数据在哪里：把所有数都加 10，平均数变了，方差一点没变。")}]},{"id":"3","label": ewt("中位数"),"answer":"c","explain": ewt("中位数是排好序后正中间的那个数，也是描述中心，而且不容易被极端值带偏。"),"wrong_reasons":[{"target":"d","why": ewt("中位数是一个位置，不衡量散布。")}]},{"id":"4","label": ewt("标准差"),"answer":"d","explain": ewt("标准差是方差开方，单位和原数据相同，衡量典型的偏离距离。"),"wrong_reasons":[{"target":"c","why": ewt("标准差衡量偏离均值有多远，它不是中心本身。")}]},{"id":"5","label": ewt("众数"),"answer":"c","explain": ewt("众数是出现次数最多的值，是另一种“最典型”的值，属于集中趋势。"),"wrong_reasons":[{"target":"d","why": ewt("众数只看哪个值最常见，和散布无关。")}]},{"id":"6","label": ewt("极差"),"answer":"d","explain": ewt("极差 = 最大值 − 最小值，一眼看出数据铺开的范围，是最简单的离散程度。"),"wrong_reasons":[{"target":"c","why": ewt("极差是两端之间的距离，不是中心的位置。")}]},{"id":"7","label": ewt("四分位距"),"answer":"d","explain": ewt("四分位距 = Q3 − Q1，是中间一半数据铺开的宽度，不受极端值影响。"),"wrong_reasons":[{"target":"c","why": ewt("四分位距衡量中间一半数据的宽度，不是中心。")}]}]};
function readConfig(){const el=document.getElementById('evowiki-config');try{return el?JSON.parse(el.textContent):DEFAULT}catch(e){return DEFAULT}}
const C=readConfig();
const $=id=>document.getElementById(id);
const esc=s=>EvoWikiLocale.string(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const match=C.mode==='match';
const T=(Array.isArray(C.targets)?C.targets:[]).slice(0,match?30:5).map((t,i)=>({id:EvoWikiLocale.string(t.id),label:EvoWikiLocale.string(t.label||( ewt("第 ")+(i+1)+ ewt(" 组"))),hint:t.hint?EvoWikiLocale.string(t.hint):''}));
while(T.length<2)T.push({id:'_'+T.length,label: ewt("其他"),hint:''});
const I=(Array.isArray(C.items)?C.items:[]).slice(0,30).map(it=>{
  let a=T.findIndex(t=>t.id===EvoWikiLocale.string(it.answer));if(a<0)a=0;
  const wr={};(Array.isArray(it.wrong_reasons)?it.wrong_reasons:[]).forEach(w=>{const k=T.findIndex(t=>t.id===EvoWikiLocale.string(w.target));if(k>=0)wr[k]=EvoWikiLocale.string(w.why||'')});
  return {id:EvoWikiLocale.string(it.id),label:EvoWikiLocale.string(it.label||'?'),a,explain:EvoWikiLocale.string(it.explain||''),wr}});
EvoWikiLocale.prop($('title'),"textContent",()=>C.title);EvoWikiLocale.prop($('question'),"textContent",()=>C.question);
EvoWikiLocale.prop($('poolLb'),"textContent",()=>match? ewt("待配对的项目（点选后点对应对象的“配到这里”，或拖过去）"): ewt("待分类的项目（点选后点某一类的“放入这一类”，或拖过去）"));
let place={},fb={},sel=null,checked=false,drag=null,msg='';
/* first placement of each item goes to the host (embed-block componentItemOf); target null: the answer was shown first */
const reported=new Set();
function report(i,target){if(reported.has(i))return;reported.add(i);parent.postMessage({evowikiComponentItem:{item:I[i].id,target}},'*')}
const ICON={ok:'<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5l3.2 3L12 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 bad:'<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
 miss:'<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.4"/></svg>'};
const WORD={ok: ewt("正确"),bad: ewt("不对"),miss: ewt("还没放")};
const q=l=>'「'+l+'」';
function chip(i,cls){return `<button type="button" class="chip${cls?' '+cls:''}" draggable="true" data-probe="item-${i}" data-item="${i}" aria-pressed="${sel===i}">${esc(I[i].label)}</button>`}
function render(){
  const act=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.probe:null;
  const pool=I.map((_,i)=>i).filter(i=>place[i]==null);
  EvoWikiLocale.prop($('pool'),"innerHTML",()=>pool.length?pool.map(i=>chip(i,checked?'miss':'')+(checked?`<span class="st miss">${ICON.miss}${WORD.miss}</span>`:'')).join(''): ewt("<p class=\"empty\">都放好了。可以点“检查全部”。</p>"));
  EvoWikiLocale.prop($('targets'),"innerHTML",()=>T.map((t,k)=>{
    const here=I.map((_,i)=>i).filter(i=>place[i]===k);
    const rows=here.map(i=>{const f=fb[i];const s=f?(f.ok?'ok':'bad'):'';
      return `<div class="it"><div class="it-top">${chip(i,s)}${f?`<span class="st ${s}">${ICON[s]}${WORD[s]}</span>`:''}</div>${f?`<p class="fb">${esc(f.text)}</p>`:''}</div>`}).join('');
    return  ewt("<section class=\"tg\" data-t=\"{0}\" aria-label=\"{1}\"><div class=\"tg-h\"><h2>{2}</h2>{3}</div>\n      <button type=\"button\" class=\"put\" data-probe=\"cat-{4}\" data-put=\"{5}\" aria-label=\"{6}{7}\">{8}</button>{9}</section>", [k,esc(t.label),esc(t.label),t.hint?`<span class="muted">${esc(t.hint)}</span>`:'',k,k,match? ewt("把选中的项目配给"): ewt("把选中的项目放入"),q(esc(t.label)),match? ewt("配到这里"): ewt("放入这一类"),rows])}).join(''));
  const placed=Object.keys(place).length,right=I.filter((it,i)=>place[i]===it.a).length;
  EvoWikiLocale.prop($('cnt'),"textContent",()=> ewt("已放 {0}/{1}，正确 {2}", [placed,I.length,right]));
  EvoWikiLocale.prop($('result'),"textContent",()=>msg);
  if(act){const n=document.querySelector(`[data-probe="${act}"]`);if(n)n.focus()}
}
function put(i,k){
  if(match)Object.keys(place).forEach(j=>{if(+j!==i&&place[j]===k){delete place[j];delete fb[j]}});
  report(i,T[k].id);place[i]=k;sel=null;const it=I[i],ok=it.a===k;
  fb[i]={ok,text:ok?it.explain:(it.wr[k]||(match? ewt("这一对不成立，换一个再试。"): ewt("它不属于这一类，换一类再试。")))};
  msg=ok? ewt("{0}{1}{2}是对的。{3}", [q(it.label),match? ewt("配"): ewt("放进"),q(T[k].label),it.explain]): ewt("{0}{1}{2}不对。{3}", [q(it.label),match? ewt("配"): ewt("放进"),q(T[k].label),fb[i].text]);
  render();
}
function unplace(i){delete place[i];delete fb[i];sel=null;msg= ewt("{0}回到了待放区。", [q(I[i].label)]);render()}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-item]'),p=e.target.closest('[data-put]');
  if(c){const i=+c.dataset.item;sel=sel===i?null:i;msg=sel==null? ewt("取消了选择。"): ewt("已选{0}。再点{1}下面的按钮，或把它拖过去。", [q(I[i].label),match? ewt("一个配对对象"): ewt("一类")]);render()}
  else if(p){if(sel==null){msg= ewt("先点选一个项目，再选放到哪里。");render()}else put(sel,+p.dataset.put)}
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-item]');if(!c)return;drag=+c.dataset.item;e.dataTransfer.setData('text/plain',EvoWikiLocale.string(drag));e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{if(drag==null)return;const t=e.target.closest&&e.target.closest('.tg,#pool');if(t){e.preventDefault();t.classList.add('over')}});
document.addEventListener('dragleave',e=>{const t=e.target.closest&&e.target.closest('.tg,#pool');if(t)t.classList.remove('over')});
document.addEventListener('drop',e=>{if(drag==null)return;const t=e.target.closest&&e.target.closest('.tg,#pool');if(!t)return;e.preventDefault();const i=drag;drag=null;t.id==='pool'?unplace(i):put(i,+t.dataset.t)});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))});
$('check').addEventListener('click',()=>{
  checked=true;const bad=[],un=[];let r=0;
  I.forEach((it,i)=>{if(place[i]==null)un.push(it.label);else if(place[i]===it.a)r++;else bad.push(it.label)});
  msg= ewt("答对 {0}/{1}。", [r,I.length])+(bad.length? ewt("要调整的：{0}（看它们下面的提示）。", [bad.map(q).join('、')]):'')+(un.length? ewt("还没放：{0}。", [un.map(q).join('、')]):'')+(r===I.length? ewt("全部放对了，每一项的理由都在它下面。"):'');
  render();
});
$('show').addEventListener('click',()=>{I.forEach((it,i)=>{report(i,null);place[i]=it.a;fb[i]={ok:true,text:it.explain}});sel=null;checked=false;msg= ewt("已显示全部答案，每一项的理由写在它下面。重置后可以再试一次。");render()});
$('reset').addEventListener('click',()=>{place={};fb={};sel=null;checked=false;msg= ewt("已重置：所有项目回到待放区。");render()});
msg=match? ewt("点选或拖动左边的项目，配给它的对应项；每放一个都会立刻告诉你对不对、为什么。"): ewt("点选或拖动一个项目，放进它所属的类别；每放一个都会立刻告诉你对不对、为什么。");
render();

EvoWikiLocale.onChange(()=>{render()});</script>
</body>
</html>
