# USD per million tokens, keyed "provider:model". Edit to match your bills.
# A model missing here is still recorded (tokens) but has no cost and does not count toward
# spending limits. input_per_mtok is the full (uncached) input rate. Optional, each on its own:
# cache_read_per_mtok / cache_write_per_mtok (prompt cache, 5-minute writes) /
# cache_write_1h_per_mtok (1-hour writes); a missing one charges those cache tokens at the input
# rate (1-hour writes: twice it), an upper bound. off_peak_factor (optional): the fraction of every
# rate billed in DeepSeek's off-peak window (llm/offpeak.py); a call is priced off-peak only when it
# lies wholly in the window and the meter has a clock. long_prompt_over_tokens + long_prompt_factor
# (optional, both or neither): a request whose prompt (input + cache reads + cache writes) is longer
# pays every rate of that request, output included, times the factor.

# Anthropic: the single source of every Anthropic price (providers.anthropic_cost reads it too).
[models."anthropic:claude-opus-5-5"]
input_per_mtok = 4.0
output_per_mtok = 20.0
cache_read_per_mtok = 0.20
cache_write_per_mtok = 5.00
cache_write_1h_per_mtok = 8.00

[models."anthropic:claude-sonnet-5-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0
cache_read_per_mtok = 0.20
cache_write_per_mtok = 2.50
cache_write_1h_per_mtok = 4.00

[models."anthropic:claude-haiku-4-5"]
input_per_mtok = 1.0
output_per_mtok = 5.0
cache_read_per_mtok = 0.10
cache_write_per_mtok = 1.25
cache_write_1h_per_mtok = 2.00

# https://platform.claude.com/docs/en/about-claude/pricing, read 2026-11-04: prompts over 100,000
# tokens pay 0.50 / 2.50 / 0.05 / 0.625 / 1.00, which is every rate here times 5.
[models."anthropic:claude-haiku-5-5"]
input_per_mtok = 0.10
output_per_mtok = 0.50
cache_read_per_mtok = 0.01
cache_write_per_mtok = 0.125
cache_write_1h_per_mtok = 0.20
long_prompt_over_tokens = 100000
long_prompt_factor = 5.0

