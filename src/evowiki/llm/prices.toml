# DeepSeek V4, published peak rates, from https://api-docs.deepseek.com/quick_start/pricing, as of
# 2026-10-14, rechecked 2026-10-21 (unchanged; off-peak = half, off_peak_factor 0.5). input_per_mtok is the
# cache-miss rate; cache_read_per_mtok the context-cache hit rate (the cache is on by default and
# the API reports prompt_cache_hit_tokens / prompt_cache_miss_tokens). There is no cache write
# charge: DeepSeek reports no written tokens (always 0), so no cache_write_per_mtok.
[models."deepseek:deepseek-v4-pro"]
input_per_mtok = 1.32
output_per_mtok = 3.96
cache_read_per_mtok = 0.044
off_peak_factor = 0.5

[models."deepseek:deepseek-v4-flash"]
input_per_mtok = 0.3
output_per_mtok = 1.2
cache_read_per_mtok = 0.006
off_peak_factor = 0.5

